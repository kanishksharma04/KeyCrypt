# Throwaway Postgres for integration tests (pnpm test:integration).
#   docker compose -f docker-compose.test.yml up -d --wait
#   export DATABASE_URL_TEST=postgresql://keycrypt:keycrypt@localhost:54329/keycrypt_test
# Data lives in tmpfs and disappears when the container stops.
services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: keycrypt
      POSTGRES_PASSWORD: keycrypt
      POSTGRES_DB: keycrypt_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycrypt -d keycrypt_test"]
      interval: 2s
      timeout: 3s
      retries: 15
