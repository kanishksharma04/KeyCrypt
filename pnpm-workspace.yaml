# The root package is the web app; extension/ is the browser extension.
packages:
  - extension

# Packages allowed to run install (build) scripts. pnpm 11 reads `allowBuilds`;
# any other dependency with a build script fails `pnpm install`.
allowBuilds:
  "@node-rs/argon2": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  sharp: true
  unrs-resolver: true
