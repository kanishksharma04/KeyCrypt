name: Release

# Pushing a version tag (e.g. v0.2.0) checks that it matches package.json, runs
# the checks, then publishes a GitHub Release whose notes are that version's
# section of CHANGELOG.md (scripts/changelog-section.mjs).

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Release notes exist
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs "$TAG" > /dev/null

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_test

  release:
    name: Publish GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/changelog-section.mjs "$TAG" > "$RUNNER_TEMP/notes.md"

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "KeyCrypt $TAG" \
            --notes-file "$RUNNER_TEMP/notes.md"
