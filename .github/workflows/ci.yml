name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Used only by the integration tests (DATABASE_URL_TEST).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Dummy values: the build validates env (src/lib/env.ts) but never connects
    # to the database, because every route is rendered on demand.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/keycrypt_ci
      AUTH_SECRET: ci-only-dummy-secret-not-used-anywhere-0123456789
      TOTP_ENCRYPTION_KEY: Y2ktb25seS1kdW1teS10b3RwLWtleS0wMTIzNDU2Nzg=
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # playwright.config.ts builds and starts the app against this database
      # (production mode, rate limits off via E2E=1 + E2E_DISABLE_RATE_LIMIT=1).
      DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_e2e_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  extension-e2e:
    name: Browser extension (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_ext_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_ext_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # playwright.extension.config.ts builds a test copy of the extension, then
      # builds and starts the app against this database. The full Chromium
      # channel loads unpacked extensions in headless mode, so no xvfb is needed.
      DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_ext_test
      NEXT_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension end-to-end tests
        run: pnpm test:extension --reporter=list,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-extension
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-smoke:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Test-only values for docker-compose.yml; never used anywhere else.
      AUTH_SECRET: docker-smoke-only-secret-not-used-anywhere-0123456789
      POSTGRES_PASSWORD: docker-smoke-only-postgres-password
      TOTP_ENCRYPTION_KEY: ZG9ja2VyLXNtb2tlLW9ubHktdG90cC1rZXktMDEyMzQ=
      APP_URL: http://localhost:3000
      DOCKER_APP_URL: http://localhost:3000
      PLAYWRIGHT_HTML_OPEN: never

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.9.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build and start the containers
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Docker smoke test
        run: pnpm test:docker --reporter=list,html

      - name: Container logs
        if: failure()
        run: docker compose logs --no-color app db

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-docker
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop the containers
        if: always()
        run: docker compose down -v
