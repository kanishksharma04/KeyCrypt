name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Used only by the integration tests (DATABASE_URL_TEST).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    # Dummy values: the build validates env (src/lib/env.ts) but never connects
    # to the database, because every route is rendered on demand.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/keycrypt_ci
      AUTH_SECRET: ci-only-dummy-secret-not-used-anywhere-0123456789
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint --max-warnings 0

      - name: Unit tests
        run: pnpm test

      - name: Integration tests
        run: pnpm test:integration
        env:
          DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_test

      - name: Build
        run: pnpm build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: keycrypt
          POSTGRES_PASSWORD: keycrypt
          POSTGRES_DB: keycrypt_e2e_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycrypt -d keycrypt_e2e_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      # playwright.config.ts builds and starts the app against this database
      # (production mode, rate limits off via E2E=1 + E2E_DISABLE_RATE_LIMIT=1).
      DATABASE_URL_TEST: postgresql://keycrypt:keycrypt@localhost:5432/keycrypt_e2e_test
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
